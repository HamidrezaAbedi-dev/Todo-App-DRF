name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Run pytest, then Flake8
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d todo_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_ENGINE: django.db.backends.postgresql
      POSTGRES_DB: todo_app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      EMAIL_HOST: localhost
      EMAIL_PORT: "25"
      EMAIL_USE_TLS: "False"
      EMAIL_USE_SSL: "False"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      SHOW_DEBUGGER_TOOLBAR: "False"
      SHOW_SWAGGER: "False"
      ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      AUTH_COOKIE_SECURE: "False"
      AUTH_COOKIE_SAMESITE: Lax
      AUTH_CSRF_AUTHENTICATION: "False"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install project and lint dependencies
        working-directory: core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        working-directory: core
        run: python -m pytest

      - name: Run Flake8
        working-directory: core
        run: python -m flake8 .
